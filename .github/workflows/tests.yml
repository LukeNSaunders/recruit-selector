name: Test and deploy

# Run on every push to main, and on every pull request
on:
  push:
    branches: [main]
  pull_request:

env:
  AZURE_WEBAPP_NAME: recruit-selector

jobs:
  # ---------- C# unit and integration tests ----------
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run the C# tests
        run: dotnet test server.Tests

  # ---------- Vue build and Playwright end-to-end tests ----------
  frontend:
    name: Frontend build and end-to-end tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the Vue app's packages
        run: npm ci

      - name: Lint the Vue code
        run: npm run lint

      - name: Type-check and build the Vue app
        run: npm run build

      - name: Install the browser for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end tests
        run: npm run test:e2e

  # ---------- Deploy to Azure (only if both test jobs pass) ----------
  deploy:
    name: Deploy to Azure
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the Vue app
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Build the C# server
        run: dotnet publish server/Server.csproj -c Release -o publish

      - name: Add the Vue app to the server
        run: |
          mkdir -p publish/wwwroot
          cp -r client/dist/. publish/wwwroot/

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish